<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Bank - Kritan Duwal</title>
<style>
:root { --bg:#f6f5f1; --panel:#fff; --line:#dedbd2; --text:#1c1d1f; --muted:#62655f; --accent:#a85f00; --soft:#f3ead9; --mono:ui-monospace,Consolas,monospace; }
@media (prefers-color-scheme: dark) { :root { --bg:#111315; --panel:#191c20; --line:#2c3138; --text:#ebeae5; --muted:#a0a39d; --accent:#f0a23b; --soft:#2a2418; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 "Segoe UI",system-ui,sans-serif; }
header { padding:22px clamp(16px,4vw,40px) 14px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
h1 { font-size:20px; margin:0 0 2px; } h1 small { font-weight:400; color:var(--muted); font-size:14px; margin-left:8px; }
h2 { font-size:13px; font-family:var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin:0 0 12px; }
h3 { font-size:15px; margin:0; }
.bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px; }
.bar > span { font-size:13px; color:var(--muted); margin-right:4px; }
button { font:inherit; cursor:pointer; }
.chip { padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-size:13.5px; }
.chip[aria-pressed=true] { background:var(--text); color:var(--bg); border-color:var(--text); }
.tabs { display:flex; gap:4px; margin-top:14px; }
.tab { padding:7px 14px; border:1px solid var(--line); border-bottom:0; border-radius:8px 8px 0 0; background:transparent; color:var(--muted); }
.tab[aria-selected=true] { background:var(--panel); color:var(--text); font-weight:600; }
input[type=search] { margin-left:auto; padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); font:inherit; width:min(260px,100%); }
main { padding:22px clamp(16px,4vw,40px) 60px; max-width:1180px; }
[hidden] { display:none !important; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:14px; }
.card[hidden] { display:none; }
.row { display:flex; justify-content:space-between; gap:12px; align-items:baseline; flex-wrap:wrap; }
.muted { color:var(--muted); font-size:13.5px; }
.copy { padding:4px 10px; border-radius:6px; border:1px solid var(--line); background:transparent; color:var(--muted); font-size:12.5px; flex:none; }
.copy:hover { color:var(--text); border-color:var(--accent); }
.primary { background:var(--accent); color:#fff; border-color:var(--accent); padding:8px 14px; border-radius:8px; border:0; font-weight:600; }
@media (prefers-color-scheme: dark) { .primary { color:#1a1206; } }
label.b { display:flex; gap:10px; padding:8px 10px; border-radius:8px; margin:4px -10px; cursor:pointer; align-items:flex-start; }
label.b:hover { background:var(--soft); }
label.b input { margin-top:4px; accent-color:var(--accent); flex:none; }
label.b.off { color:var(--muted); }
.caveat { background:var(--soft); border-left:3px solid var(--accent); padding:8px 12px; border-radius:4px; font-size:13.5px; margin:10px 0 0; }
.pill { font:11px var(--mono); padding:2px 6px; border-radius:4px; background:var(--soft); color:var(--accent); margin-left:6px; white-space:nowrap; }
.tags span { display:inline-block; font:11.5px var(--mono); padding:3px 7px; border-radius:5px; background:var(--soft); margin:6px 6px 0 0; }
.paths { margin:10px 0 0; padding:0; list-style:none; }
.paths li { display:flex; gap:8px; align-items:center; font:12.5px var(--mono); padding:3px 0; word-break:break-all; }
.paths a { color:var(--text); }
ul.plain { margin:8px 0 0; padding-left:18px; } ul.plain li { margin:4px 0; }
.two { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; }
@media (max-width:800px){ .two { grid-template-columns:minmax(0,1fr); } input[type=search]{ margin-left:0; } }
#toast { position:fixed; bottom:20px; left:50%; translate:-50% 0; background:var(--text); color:var(--bg); padding:8px 16px; border-radius:8px; font-size:13.5px; opacity:0; transition:opacity .2s; pointer-events:none; }
#toast.on { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>Career Bank <small>Pick the role, tick the bullets, copy the resume draft.</small></h1>
  <div class="bar"><span>Applying for:</span><div id="targets" class="bar" style="margin:0"></div></div>
  <div class="bar" style="margin-top:14px;margin-bottom:-15px">
    <div class="tabs" role="tablist" style="margin:0">
      <button class="tab" role="tab" data-tab="build" aria-selected="true">Resume builder</button>
      <button class="tab" role="tab" data-tab="projects" aria-selected="false">Project index</button>
      <button class="tab" role="tab" data-tab="skills" aria-selected="false">Skills &amp; archive</button>
    </div>
    <input type="search" id="q" placeholder="Search everything" aria-label="Search">
  </div>
</header>
<main>
  <section id="build"></section>
  <section id="projects" hidden></section>
  <section id="skills" hidden></section>
</main>
<div id="toast" role="status"></div>

<script src="data.js"></script>
<script>
(function () {
  const D = window.PORTFOLIO, $ = s => document.querySelector(s);
  const h = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') n.className = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) n.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null) n.append(k);
    return n;
  };
  const byId = Object.fromEntries(D.projects.map(p => [p.id, p]));
  let target = D.targets[0].id;
  const picked = {}; // target id -> Set of bullet keys the user changed from the default

  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 1400); }
  function copy(text, what) { navigator.clipboard.writeText(text).then(() => toast((what || 'Text') + ' copied'), () => toast('Copy failed - select the text manually')); }
  const copyBtn = (text, what) => h('button', { class: 'copy', onclick: e => { e.preventDefault(); copy(typeof text === 'function' ? text() : text, what); } }, 'Copy');
  const fileUrl = p => 'file:///' + encodeURI(p).replace(/#/g, '%23');

  // ---------- resume builder ----------
  // Default: resume bullets that fit the role, plus extra bullets from the role's top three projects.
  function isOn(key, b, project) {
    const s = picked[target] || (picked[target] = new Map());
    if (s.has(key)) return s.get(key);
    const top = D.targets.find(t => t.id === target).lead.slice(0, 3);
    return b.t.includes(target) && (!b.alt || top.includes(project));
  }
  function bulletRow(key, b, project) {
    const on = isOn(key, b, project), fits = b.t.includes(target);
    const box = h('input', { type: 'checkbox', onchange: e => { picked[target].set(key, e.target.checked); row.classList.toggle('off', !e.target.checked); } });
    box.checked = on;
    const row = h('label', { class: 'b' + (on ? '' : ' off') }, box,
      h('span', {}, b.text, fits ? h('span', { class: 'pill' }, b.alt ? 'fits · extra' : 'fits') : null, !fits && b.alt ? h('span', { class: 'pill' }, 'extra') : null));
    return row;
  }
  function blocks() {
    const T = D.targets.find(t => t.id === target);
    const rank = id => { const i = T.lead.indexOf(id); return i < 0 ? 99 : i; };
    const proj = [...D.projectBullets].sort((a, b) => rank(a.project) - rank(b.project));
    return { T, exp: D.experience, proj };
  }
  function draft() {
    const { T, exp, proj } = blocks(), out = [];
    out.push('SUMMARY', T.summary, '');
    out.push('WORK EXPERIENCE');
    exp.forEach(x => {
      const bs = x.bullets.filter((b, i) => isOn(x.id + ':' + i, b, x.project));
      if (bs.length) out.push(x.title + ' at ' + x.org + '  |  ' + x.dates, ...bs.map(b => '• ' + b.text), '');
    });
    out.push('RESEARCH PUBLICATION & PROJECTS');
    proj.forEach(x => {
      const bs = x.bullets.filter((b, i) => isOn(x.project + ':' + i, b, x.project));
      if (bs.length) out.push(x.heading + '  |  ' + x.dates, ...bs.map(b => '• ' + b.text), '');
    });
    out.push('SKILLS', ...T.skills.map(s => '• ' + s));
    return out.join('\n');
  }
  function renderBuild() {
    const { T, exp, proj } = blocks(), root = $('#build');
    root.replaceChildren(
      h('div', { class: 'card' },
        h('div', { class: 'row' }, h('h2', {}, 'Summary for: ' + T.label), copyBtn(T.summary, 'Summary')),
        h('p', { style: 'margin:0' }, T.summary),
        h('p', { class: 'muted', style: 'margin:10px 0 0' }, 'Keywords to mirror from the posting: ' + T.keywords.join(', '))),
      h('div', { class: 'two' },
        h('div', { class: 'card' }, h('div', { class: 'row' }, h('h2', {}, 'Skills, in this order'), copyBtn(T.skills.map(s => '• ' + s).join('\n'), 'Skills')),
          h('ul', { class: 'plain' }, T.skills.map(s => h('li', {}, s)))),
        h('div', { class: 'card' }, h('h2', {}, 'Lead with these'),
          h('ul', { class: 'plain' }, T.lead.map(id => h('li', {}, h('a', { href: '#', onclick: e => { e.preventDefault(); openProject(id); } }, byId[id].short)))))),
      h('div', { class: 'card' }, h('div', { class: 'row' }, h('h2', {}, 'Work experience'), h('span', { class: 'muted' }, '"fits" = suits this role. "extra" = not on the current resume.')),
        exp.map(x => h('div', { style: 'margin-bottom:14px' },
          h('div', { class: 'row' }, h('h3', {}, x.title + ' · ' + x.org), h('span', { class: 'muted' }, x.dates)),
          x.bullets.map((b, i) => bulletRow(x.id + ':' + i, b, x.project))))),
      h('div', { class: 'card' }, h('h2', {}, 'Research and projects (ordered for this role)'),
        proj.map(x => h('div', { style: 'margin-bottom:14px' },
          h('div', { class: 'row' }, h('h3', {}, x.heading), h('span', { class: 'muted' }, x.dates)),
          x.bullets.map((b, i) => bulletRow(x.project + ':' + i, b, x.project))))),
      h('button', { class: 'primary', onclick: () => copy(draft(), 'Resume draft') }, 'Copy resume draft with ticked bullets'));
  }

  // ---------- project index ----------
  function openProject(id) { showTab('projects'); const n = document.getElementById('p-' + id); n.scrollIntoView({ block: 'start' }); n.style.outline = '2px solid var(--accent)'; setTimeout(() => n.style.outline = '', 1600); }
  function renderProjects() {
    const cat = Object.fromEntries(D.categories.map(c => [c.id, c.label]));
    $('#projects').replaceChildren(...D.projects.map(p => h('div', { class: 'card', id: 'p-' + p.id, 'data-search': JSON.stringify(p).toLowerCase() },
      h('div', { class: 'row' }, h('h3', {}, p.short, p.onResume ? h('span', { class: 'pill' }, 'on resume') : h('span', { class: 'pill' }, 'not on resume')), h('span', { class: 'muted' }, cat[p.cat] + ' · ' + p.period)),
      h('p', { class: 'muted', style: 'margin:4px 0 8px' }, p.role),
      h('div', { class: 'row' }, h('p', { style: 'margin:0;flex:1' }, p.summary), copyBtn(p.summary, 'Summary')),
      h('ul', { class: 'plain' }, p.points.map(t => h('li', {}, t))),
      p.caveat ? h('p', { class: 'caveat' }, 'Check before using: ' + p.caveat) : null,
      h('div', { class: 'tags' }, p.stack.map(s => h('span', {}, s))),
      (p.links || []).length ? h('p', { style: 'margin:10px 0 0' }, p.links.map(l => h('a', { href: l.href, target: '_blank', rel: 'noopener', style: 'margin-right:14px' }, l.label))) : null,
      h('ul', { class: 'paths' }, p.evidence.map(e => h('li', {}, copyBtn(e.replace(/\//g, '\\'), 'Path'), h('a', { href: fileUrl(e), target: '_blank' }, e.replace(/^C:\/Users\/dkrit\//, ''))))))));
  }

  // ---------- skills + archive ----------
  function renderSkills() {
    $('#skills').replaceChildren(
      h('div', { class: 'card' }, h('h2', {}, 'Full skill bank'),
        D.skillBank.map(s => h('div', { class: 'row', style: 'padding:6px 0;border-bottom:1px solid var(--line)', 'data-search': (s.group + s.items).toLowerCase() },
          h('span', { style: 'flex:1' }, h('b', {}, s.group + ': '), s.items), copyBtn(s.group + ' - ' + s.items, 'Skill line')))),
      h('div', { class: 'card' }, h('h2', {}, 'Links'),
        h('ul', { class: 'paths' }, Object.entries(D.person.links).map(([k, v]) => h('li', {}, copyBtn(v, 'Link'), h('a', { href: v, target: '_blank', rel: 'noopener' }, k + ': ' + v))))),
      h('div', { class: 'card' }, h('h2', {}, 'Education'),
        D.person.education.map(e => h('p', { style: 'margin:0 0 8px' }, h('b', {}, e.degree), ' · ' + e.school + ' · ' + e.dates, h('br'), h('span', { class: 'muted' }, 'Coursework: ' + e.courses)))),
      h('div', { class: 'card' }, h('h2', {}, 'Archive: other material on disk'),
        h('ul', { class: 'paths' }, D.archive.map(a => h('li', {}, copyBtn(a.path.replace(/\//g, '\\'), 'Path'), h('span', {}, a.what + ' - ', h('a', { href: fileUrl(a.path), target: '_blank' }, a.path.replace(/^C:\/Users\/dkrit\//, ''))))))));
  }

  // ---------- chrome ----------
  function showTab(id) {
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === id)));
    document.querySelectorAll('main > section').forEach(s => { s.hidden = s.id !== id; });
  }
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => showTab(t.dataset.tab)));
  const chips = D.targets.map(t => h('button', { class: 'chip', 'aria-pressed': String(t.id === target), onclick: () => {
    target = t.id; chips.forEach((c, i) => c.setAttribute('aria-pressed', String(D.targets[i].id === target))); renderBuild();
  } }, t.label));
  $('#targets').append(...chips);
  $('#q').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    if (q && !$('#build').hidden) showTab('projects');
    document.querySelectorAll('[data-search]').forEach(n => { n.hidden = !!q && !n.dataset.search.includes(q); });
  });
  renderBuild(); renderProjects(); renderSkills();
})();
</script>
</body>
</html>
